# Async-mesh testbed: 7 workers -> 3 stages, R=2 pipes + 1 SPARE.
#
# The worked example from ASYNC_MESH_DESIGN.md §3.10. Stage 0 gets 3
# workers, stages 1-2 get 2 each, so R = min(3,2,2) = 2 and the leftover
# stage-0 worker is a spare. A worker death is absorbed by promoting that
# spare with ZERO transfer and R holds at 2 — the headline fault-tolerance
# claim.
#
# VRAM: ~6.6 GB (7 CUDA contexts at ~250-400 MB each are NOT covered by
# set_per_process_memory_fraction). Needs roughly an 8 GB card. On a
# smaller GPU this spills into WDDM shared memory: still correct, but
# steps stretch to minutes. Use docker-compose.mesh-nospare.yml instead.
services:
  gateway:
    build:
      context: .
      target: gateway
    image: kiwi-gateway:latest
    container_name: kiwi_gateway_mesh
    command: uvicorn gateway:app --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
      - "4001:4001"
    environment:
      KIWI_MODELS: |
        [
          {"model_id": "Qwen/Qwen2.5-0.5B-Instruct", "aliases": ["qwen-0.5b", "kiwi-small"], "default_dtype": "bfloat16"}
        ]
      REQUEST_TIMEOUT_SECONDS: "300"
      # Tolerant enough that a briefly-slow worker isn't evicted as a dead one
      # (heartbeat interval is 5s, so this is ~9 missed beats), but tight enough
      # that a REAL death is detected in under a minute. The no-spare compose
      # uses a much wider window because it targets an oversubscribed GPU where
      # a single step can stall for minutes; this file assumes VRAM headroom.
      HEARTBEAT_SOFT_STALE_SECONDS: "45"
      HEARTBEAT_HARD_STALE_SECONDS: "300"
      KIWI_P2P_TRANSPORT: "p2p"
      KIWI_P2P_PORT: "4001"
      KIWI_P2P_PUBLIC_HOST: "http://gateway:4001"
    volumes:
      - hf_cache:/root/.cache/huggingface
      - ./gateway.py:/app/gateway.py
      - ./models.py:/app/models.py
      - ./transport.py:/app/transport.py
      - ./index.html:/app/index.html
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker_1:
    build:
      context: .
      target: worker
    image: kiwi-worker:latest
    container_name: kiwi-worker_1_mesh
    init: true
    command: uvicorn worker:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
      - "4002:4002"
    environment:
      NODE_NAME: worker_1
      NODE_URL: http://worker_1:8000
      GATEWAY_URL: http://gateway:8080
      KIWI_P2P_TRANSPORT: "p2p"
      KIWI_P2P_PORT: "4002"
      KIWI_RELAY_PEERS: ""
      GPU_MEMORY_RESERVE_MB: "512"
      KIWI_VRAM_GB_OVERRIDE: "0.9"
      KIWI_LR: ${KIWI_LR:-2e-4}
      KIWI_FREEZE_LORA_A: ${KIWI_FREEZE_LORA_A:-0}
      KIWI_T_ROUND: "120"
    volumes:
      - hf_cache:/root/.cache/huggingface
      - ./worker.py:/app/worker.py
      - ./mesh.py:/app/mesh.py
      - ./models.py:/app/models.py
      - ./transport.py:/app/transport.py
    depends_on:
      gateway:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [ gpu ]

