# ══════════════════════════════════════════════════════════════════════════
# Kiwi training benchmark scenarios
#
# Two corpora, two jobs:
#
#   zorbulax4  — 4 facts, memorization. Fast, and the correctness smoke test.
#                But maximally NON-I.I.D. under sharding: each replica
#                memorizes different facts and the merge erases both, so
#                averaging-QUALITY conclusions drawn from it are invalid.
#                Kept only for the legacy baselines below. No held-out split
#                exists, so eval_every stays 0.
#   truthfulqa — 600 train + 150 held-out. Chosen by probe over alpaca1k,
#                gsm8k and sql_create_context: it was the only corpus whose
#                eval loss kept falling (drop 0.854, second-half descent
#                0.159; the others plateaued within 100–500 samples). The
#                A/B is decided here, on HELD-OUT loss.
#
# Why truthfulqa works when "harder" corpora did not: sql and gsm8k start at
# LOW loss because each has a learnable template the model fits in ~100
# samples, after which the residual is irreducible. alpaca starts moderate
# but its residual is genuine AMBIGUITY ("write a poem" has many valid
# continuations). truthfulqa starts highest because its answers are
# deliberately counterintuitive corrections to common misconceptions, so the
# model's prior actively fights the target — and unlike ambiguity, that gap
# is REDUCIBLE. The criterion is "high loss that is reducible", not "a hard
# task".
#
# Eval cadence: eval_every counts SAMPLES CONSUMED; each point averages
# `eval_samples` held-out examples. 100/64 costs ~450 extra forward passes
# against 600 train steps. Do NOT change eval_every or full_sync_every in
# isolation — the sparse arms' eval points land just after full-sync rounds
# only because the two cadences align, and breaking that would make eval
# measure a single drifted replica instead of the consensus model.
#
# Averaging cadence, all mesh arms: a DENSE merge every 10 steps per replica.
#   kiwi_mesh2_dense   X=10, all rounds dense
#   kiwi_mesh2_outer   X=10, all rounds dense, applied through the outer optimizer
#   kiwi_mesh2_sparse5  X=1  (a cheap 5% round every step), every 10th round dense
# Holding the dense-merge cadence equal across arms is what makes them
# one-variable comparisons.
#
# History: 18 scenarios were removed once their questions were settled — the
# R=2 regression diagnostic sweep (X-sweep, shard modes, freeze_a, mirror,
# matched_steps), the zorbulax smoke suite, and three unrun A/B extras
# (sparse20, sparse_diloco, alpaca_lr2x). Their findings are recorded in
# IMPLEMENTATION_PLAN.md under "established experimental facts"; the configs
# are in git history.
# ══════════════════════════════════════════════════════════════════════════

scenarios:

  # ══════════════════════════════════════════════════════════════════════
  # LEGACY zorbulax4 baselines — 40-sample runs (10 epochs x 4 facts).
  #
  # Kept so the recorded benchmark_results/ numbers stay reproducible from
  # config. Do not "modernise" these: changing epochs, X or the corpus makes
  # them incomparable with the results they exist to reproduce. For anything
  # new, use the truthfulqa arms below.
  # ══════════════════════════════════════════════════════════════════════

  - name: "sm_zorb"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 5
    epochs: 10
    target_loss: 2.0
    workers: []          # In-process

  - name: "sm_offload_zorb"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 5
    epochs: 10
    target_loss: 2.0
    workers: []          # In-process (own DeepSpeed container)

  # The pipeline control. Non-negotiable: without it "averaging works" cannot
  # be separated from "we changed the compute".
  - name: "kiwi_pipeline_zorb"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 5
    epochs: 10
    target_loss: 2.0
    workers: [0.9, 0.9, 0.9]      # 3 workers via gateway
    replicas: 1
    compose: "docker-compose.internet.yml"

  # 7 workers = 2 pipes x 3 stages + 1 spare. Needs ~6.6 GB. On a card under
  # 8 GB switch to docker-compose.mesh-nospare.yml and drop to six workers,
  # which trades spare promotion for the R-degrades-to-1 path.
  - name: "kiwi_mesh2_zorb"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 5
    epochs: 10
    target_loss: 2.0
    workers: [0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9]
    replicas: 2
    average_every: 2
    compose: "docker-compose.mesh.yml"

  # ══════════════════════════════════════════════════════════════════════
  # THE A/B — truthfulqa, 1 epoch (600 samples), held-out loss.
  #
  # Reference -> control -> baseline -> mechanisms, so each comparison
  # changes one thing:
  #   sm  vs sm_offload   does CPU offload change what is learned?
  #   sm  vs kiwi_pipeline   does splitting the model across workers?
  #   kiwi_pipeline vs kiwi_mesh2_dense   what does averaging cost at equal samples?
  #   kiwi_mesh2_dense vs sparse5/diloco  which mechanism closes that gap?
  #
  # Naming: <system>[_<topology>][_<mechanism>][_<variant>].
  #   sm            single GPU, no pipeline, no averaging
  #   kiwi_pipeline model split across workers, ONE pipeline (R=1)
  #   kiwi_mesh2    2 pipelines whose adapters are averaged
  #   _zorb         the legacy zorbulax4 baselines above; the corpus is in the
  #                 name only there, because those arms share a topology with
  #                 the truthfulqa ones and would otherwise collide
  # Keys now match the display labels in plot.py's CONFIG_STYLES, so what you
  # type on the command line is what you read on the figure.
  #
  # These keys were renamed from dp1/dp2/*_alpaca. Results are matched by
  # scenario name, so results files predating the rename will not line up —
  # that was accepted deliberately in favour of consistent naming.
  # ══════════════════════════════════════════════════════════════════════

  # Reference: one GPU, whole model, no pipeline, no averaging.
  - name: "sm"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 3
    epochs: 1
    target_loss: 2.0
    dataset: "truthfulqa"
    eval_every: 100
    eval_samples: 64
    batch_size: 1
    workers: []

  # DeepSpeed ZeRO-3 CPU-offload reference. Runs in its own container; the
  # orchestrator exports the tokenised corpus to the results directory
  # (already bind-mounted at /output) so this trains the SAME data as every
  # other arm. Every KIWI_* variable it reads must also be DECLARED in
  # docker-compose.deepspeed.yml — Compose uses the host environment only for
  # ${...} interpolation and forwards nothing else.
  - name: "sm_offload"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 3
    epochs: 1
    target_loss: 2.0
    dataset: "truthfulqa"
    eval_every: 100
    eval_samples: 64
    batch_size: 1
    workers: []

  # Pipeline control: the model split across 3 workers, R=1, no averaging.
  # Any gap between this and sm is a PIPELINE bug; only a gap between
  # this and the mesh arms is attributable to averaging.
  - name: "kiwi_pipeline"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 3
    epochs: 1
    target_loss: 2.0
    dataset: "truthfulqa"
    eval_every: 100
    eval_samples: 64
    batch_size: 1
    workers: [0.9, 0.9, 0.9]
    replicas: 1
    compose: "docker-compose.internet.yml"

  # The A/B baseline: dense uniform averaging, every 10 steps per replica.
  # (X was 2 when a run was 40 samples; at 600 that fired a ~4 s barrier every
  # 4 samples — 150 rounds of mostly overhead.)
  - name: "kiwi_mesh2_dense"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 3
    epochs: 1
    target_loss: 2.0
    dataset: "truthfulqa"
    eval_every: 100
    eval_samples: 64
    workers: [0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9]
    replicas: 2
    average_every: 10
    compose: "docker-compose.mesh.yml"

  # Mechanism 1 — sparse averaging. A round EVERY step, but each exchanges
  # only 5% of adapter values, so a merge perturbs ~p of the weights and the
  # local Adam moments stay approximately valid. Every 10th round is dense,
  # which restores exact replica agreement (measured: spread collapses to
  # 0.000000 at each full sync) and keeps spare promotion zero-cost.
  # Frequent cheap rounds ARE the mechanism — raising average_every turns
  # this into "dense averaging that drops 95% of the update".
  - name: "kiwi_mesh2_sparse5"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 3
    epochs: 1
    target_loss: 2.0
    dataset: "truthfulqa"
    eval_every: 100
    eval_samples: 64
    workers: [0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9]
    replicas: 2
    average_every: 1
    sparse_p: 0.05
    full_sync_every: 10
    compose: "docker-compose.mesh.yml"

  # Mechanism 2 — DiLoCo outer optimizer. Same dense merges as kiwi_mesh2_dense at
  # the same cadence, but applied through a Nesterov outer step (lr 0.7,
  # momentum 0.9) instead of overwriting weights. Same merge frequency as the
  # baseline, so the outer optimizer is the only variable.
  - name: "kiwi_mesh2_outer"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 3
    epochs: 1
    target_loss: 2.0
    dataset: "truthfulqa"
    eval_every: 100
    eval_samples: 64
    workers: [0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9]
    replicas: 2
    average_every: 10
    outer_opt: true
    compose: "docker-compose.mesh.yml"

  # Recovery: the sparse arm plus a mid-run worker loss. A same-stage spare
  # has been receiving sparse payloads throughout, so promotion should cost
  # ~0, R should hold at 2, and degraded_sample_fraction should stay 0.0.
  #
  # kill_after_SAMPLES, not kill_after_epochs: these runs are 1 epoch, and an
  # epoch-boundary kill fires only once the epoch completes — after the last
  # sample, with nothing left to train. 300 is the halfway point.
  - name: "kiwi_mesh2_sparse5_kill"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 3
    epochs: 1
    target_loss: 2.0
    dataset: "truthfulqa"
    eval_every: 100
    eval_samples: 64
    workers: [0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9]
    replicas: 2
    average_every: 1
    sparse_p: 0.05
    full_sync_every: 10
    kill_after_samples: 309
    compose: "docker-compose.mesh.yml"

  # ══════════════════════════════════════════════════════════════════════
  # NO-SPARE VARIANTS — 6 workers (2 pipes x 3 stages), no spare.
  #
  # Each mirrors the arm above it EXACTLY except for the worker count and the
  # compose file. Same corpus, seeds, epochs, eval cadence, R, and each arm's
  # own averaging settings — so the only variable is whether a hot spare
  # exists.
  #
  # What this measures is the COST OF KEEPING A SPARE, not "more workers
  # learn better". The spare never trains; it only RECEIVES round payloads so
  # it stays promotable at ~0 transfer. R is 2 either way and the data
  # schedule is identical, so convergence should match within seed noise.
  # A visible convergence gap would mean the spare is influencing training,
  # which it must not — that would be a bug, not a result.
  #
  # The difference should show up in cost instead:
  #   - fewer processes contending for one GPU (6 vs 7)
  #   - contributors fan out to 1 same-stage peer instead of 2, so smaller
  #     round payload traffic and one less merge per round
  # Both push the barrier time down. Read avg_round_ms and the round_profile,
  # not just the loss curves.
  #
  # Deliberately NO kill variant: with no spare there is nothing to promote,
  # so a kill loses the pipe and degrades R to 1. That is the graceful-
  # degradation path — a different question from zero-cost promotion, and it
  # would be misread as "kill with 6 workers vs kill with 7".
  # ══════════════════════════════════════════════════════════════════════

  - name: "kiwi_mesh2_dense_nospare"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 3
    epochs: 1
    target_loss: 2.0
    dataset: "truthfulqa"
    eval_every: 100
    eval_samples: 64
    workers: [0.9, 0.9, 0.9, 0.9, 0.9, 0.9]
    replicas: 2
    average_every: 10
    compose: "docker-compose.mesh-nospare.yml"

  - name: "kiwi_mesh2_sparse5_nospare"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 3
    epochs: 1
    target_loss: 2.0
    dataset: "truthfulqa"
    eval_every: 100
    eval_samples: 64
    workers: [0.9, 0.9, 0.9, 0.9, 0.9, 0.9]
    replicas: 2
    average_every: 1
    sparse_p: 0.05
    full_sync_every: 10
    compose: "docker-compose.mesh-nospare.yml"

  - name: "kiwi_mesh2_outer_nospare"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 3
    epochs: 1
    target_loss: 2.0
    dataset: "truthfulqa"
    eval_every: 100
    eval_samples: 64
    workers: [0.9, 0.9, 0.9, 0.9, 0.9, 0.9]
    replicas: 2
    average_every: 10
    outer_opt: true
    compose: "docker-compose.mesh-nospare.yml"
