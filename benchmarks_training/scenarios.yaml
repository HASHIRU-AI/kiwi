scenarios:
  - name: "single_machine"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 5
    epochs: 10
    target_loss: 2.0
    workers: [] # In-process

  - name: "distributed_3stage"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 5
    epochs: 10
    target_loss: 2.0
    workers: [0.9, 0.9, 0.9] # 3 workers via gateway
