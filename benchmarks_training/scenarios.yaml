# ══════════════════════════════════════════════════════════════════════════
# Two corpora, two jobs (Phase 1).
#
#   zorbulax4 — 4 facts, memorization. FAST and it is the correctness smoke
#               test, but maximally NON-I.I.D. under sharding: each replica
#               memorizes different facts and the merge erases both. Averaging
#               QUALITY conclusions drawn from it are invalid. Kept forever,
#               scoped to what it can actually answer. No held-out split
#               exists, so eval_every is left at 0.
#   alpaca1k  — 1,000 train + 200 held-out from yahma/alpaca-cleaned, fixed
#               seed, fixed slice. I.i.d.-shardable, so this is where the
#               sparse-vs-DiLoCo A/B is decided, on HELD-OUT loss.
#
# Rule of thumb from the plan: iterate on zorbulax4 for correctness (fast),
# run alpaca1k for conclusions (valid).
#
# Eval cadence: eval_every counts SAMPLES CONSUMED, and each point averages
# `eval_samples` held-out examples through the live pipeline. 100/64 costs
# ~640 extra forward passes against 1,000 train steps (~20% overhead, since
# an eval forward skips the backward). The plan suggests ~25; at 64 samples
# a point that would be ~85% overhead and the measurement would cost more
# than the experiment. Tighten it if a run has budget to spare.
# ══════════════════════════════════════════════════════════════════════════

scenarios:
  - name: "single_machine"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 5
    epochs: 10
    target_loss: 2.0
    workers: [] # In-process

  - name: "single_machine_offload"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 5
    epochs: 10
    target_loss: 2.0
    workers: [] # In-process

  # - name: "single_machine_qlora"
  #   model: "Qwen/Qwen2.5-0.5B-Instruct"
  #   num_seeds: 5
  #   epochs: 10
  #   target_loss: 2.0
  #   workers: [] # In-process

  # The control (§6.2): the existing 3-stage pipeline, renamed. Non-negotiable —
  # without it "averaging works" cannot be separated from "we changed the compute".
  - name: "dp1"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 5
    epochs: 10
    target_loss: 2.0
    workers: [0.9, 0.9, 0.9] # 3 workers via gateway
    replicas: 1
    compose: "docker-compose.internet.yml"

  # Diagnostic control: R=1 driven through MeshRunner. The work queue, the
  # consumer, the barrier and the /round fan-out all execute, but with a single
  # contributor every merge is a mathematical no-op (expect=0, send_to=[]).
  #
  # So dp1_mesh vs dp1 isolates HARNESS PLUMBING from AVERAGING SEMANTICS:
  #   - dp1_mesh ~= dp1  -> the plumbing is sound; any dp2 gap is real
  #     behaviour of weight averaging, not a bug in the round path.
  #   - dp1_mesh <  dp1  -> the round path itself is damaging the adapter, and
  #     the dp2 result says nothing about averaging.
  - name: "dp1_mesh"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 5
    epochs: 10
    target_loss: 2.0
    workers: [0.9, 0.9, 0.9]
    replicas: 1
    average_every: 2
    compose: "docker-compose.internet.yml"
    runner: "mesh"        # force MeshRunner despite R=1

  # Headline (§6.2): does the mesh run and learn without regression?
  # X=2 (not 10) so rounds actually fire ~10 times per run at N=4 (§6.3).
  # 7 workers = 2 pipes x 3 stages + 1 spare (the §3.10 reference layout).
  # Needs ~6.6 GB. On a small card (<8 GB) switch both dp2 scenarios to
  # docker-compose.mesh-nospare.yml and drop `workers` to six entries; that
  # trades spare promotion for the R-degrades-to-1 path.
  - name: "dp2"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 5
    epochs: 10
    target_loss: 2.0
    workers: [0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9] # 7 workers: 2 pipes + 1 spare
    replicas: 2
    average_every: 2
    compose: "docker-compose.mesh.yml"

  # Same mesh as dp2, but each replica is pinned to a fixed slice of the
  # dataset (replica r owns samples[r::R]) instead of taking whatever the
  # shared queue hands it. This is the §6.7 static-shard mode, and it mirrors
  # what scratch/test_stage6_mesh.py does — which converged to ~0.01 while the
  # queue-driven dp2 stalled around 1.3 on identical hardware and settings.
  # If dp2_static ~= dp1, the mesh is fine and the queue's per-window
  # re-pairing is what breaks averaging at N=4.
  - name: "dp2_static"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 5
    epochs: 10
    target_loss: 2.0
    workers: [0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9]
    replicas: 2
    average_every: 2
    compose: "docker-compose.mesh.yml"
    shard_mode: "static"

  # Third assignment regime: same fixed grouping as dp2_static, but the groups
  # ROTATE between replicas each window, so every replica eventually sees every
  # fact while still specialising on a consistent subset between merges.
  # This is exactly what scratch/test_stage6_mesh.py does — the run that
  # converged to ~0.01 where queue-driven dp2 stalled at ~1.3. If dp2_rotate
  # reproduces ~0.01, the e2e result is explained and the variable is the data
  # assignment, not the mesh.
  - name: "dp2_rotate"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 5
    epochs: 10
    target_loss: 2.0
    workers: [0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9]
    replicas: 2
    average_every: 2
    compose: "docker-compose.mesh.yml"
    shard_mode: "rotate"

  # Fault injection mid-run (§6.2). Fully valid at N=4 — recovery needs no
  # data diversity. Kills an active worker that has a same-stage spare, so the
  # spare is promoted with ZERO transfer and R holds at 2 — throughput and
  # convergence should both be unaffected. `degraded_sample_fraction` records
  # any samples trained below nominal R (expected: 0.0 with a spare present).
  # - name: "dp2_kill"
  #   model: "Qwen/Qwen2.5-0.5B-Instruct"
  #   num_seeds: 5
  #   epochs: 10
  #   target_loss: 2.0
  #   workers: [0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9]
  #   replicas: 2
  #   average_every: 2
  #   compose: "docker-compose.mesh.yml"
  #   kill_after_epochs: 5

  # ── Diagnostic sweep: WHY does R=2 regress when R=1 (dp1_mesh) does not? ──
  # dp2 / dp2_static / dp2_rotate all landed ~1.1-1.6 regardless of how data was
  # assigned, so the cause is the averaging operation, not the data. Two
  # candidate mechanisms, and these scenarios separate them:
  #
  #   (a) MERGE FREQUENCY vs ADAM. Moments are local and never averaged (§4.2),
  #       so every merge hands Adam a weight jump it knows nothing about. At
  #       X=2 half of all steps follow such a jump. If this dominates, loss
  #       should IMPROVE monotonically as X grows.
  #   (b) LoRA BILINEARITY. mean(A)*mean(B) != mean(A*B); the cross terms are
  #       spurious and are present at EVERY merge regardless of X. If this
  #       dominates, the X sweep stays flat and only freeze_a helps.
  #
  # Note the design doc predicts the opposite of (a): it argues smaller X means
  # less drift and therefore a more accurate merge. Worth settling by measuring.

  - name: "dp2_x1"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 3
    epochs: 10
    target_loss: 2.0
    workers: [0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9]
    replicas: 2
    average_every: 1
    compose: "docker-compose.mesh.yml"

  - name: "dp2_x5"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 3
    epochs: 10
    target_loss: 2.0
    workers: [0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9]
    replicas: 2
    average_every: 5
    compose: "docker-compose.mesh.yml"

  - name: "dp2_x20"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 3
    epochs: 10
    target_loss: 2.0
    workers: [0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9]
    replicas: 2
    average_every: 20
    compose: "docker-compose.mesh.yml"

  # §3.5 mitigation: hold LoRA A at its random init and train/average only B.
  # All replicas then share an identical A, the cross terms vanish, and weight
  # averaging becomes EXACT — at some cost in capacity. If this alone recovers
  # dp1-like convergence, bilinearity was the cause.
  - name: "dp2_freeze_a"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 3
    epochs: 10
    target_loss: 2.0
    workers: [0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9]
    replicas: 2
    average_every: 2
    compose: "docker-compose.mesh.yml"
    freeze_lora_a: true

  # Control for freeze_a: same toggle at R=1, so any capacity loss from
  # freezing A is measured WITHOUT any averaging in play.
  - name: "dp1_freeze_a"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 3
    epochs: 10
    target_loss: 2.0
    workers: [0.9, 0.9, 0.9]
    replicas: 1
    compose: "docker-compose.internet.yml"
    freeze_lora_a: true

  # THE MISSING CONTROL. queue/static/rotate all gave each replica a disjoint
  # half of every window, so they never tested whether replicas sharing data
  # fixes averaging. Here both replicas train on the SAME batches, so the two
  # adapters should stay nearly identical and the merge has nothing to
  # reconcile. Compare per STEPS PER REPLICA (40) against dp1 (40 steps), not
  # on samples consumed — each batch is trained twice here.
  #   mirror ~= dp1   -> averaging is sound; the dp2 penalty is entirely the
  #                      cost of merging models trained on different data.
  #   mirror still bad-> the merge damages weights even with nothing to
  #                      reconcile, and the bug is in averaging itself.
  - name: "dp2_mirror"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 3
    epochs: 10
    target_loss: 2.0
    workers: [0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9]
    replicas: 2
    average_every: 2
    compose: "docker-compose.mesh.yml"
    shard_mode: "mirror"

  # LINEAR SCALING RULE. Averaging makes the effective update the MEAN of the R
  # local updates, so at a fixed LR an R=2 mesh travels ~half the distance per
  # sample that R=1 does — the equal-samples comparison handicaps the mesh
  # before averaging quality even enters. Standard correction: LR x R.
  # If dp2_lr2x closes most of the gap to dp1, the "regression" was largely a
  # missing hyperparameter adjustment, not a defect in the mesh.
  - name: "dp2_lr2x"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 3
    epochs: 10
    target_loss: 2.0
    workers: [0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9]
    replicas: 2
    average_every: 2
    compose: "docker-compose.mesh.yml"
    lr_scale: 2.0

  # MATCHED SEQUENTIAL DEPTH — the comparison the mesh actually exists to win.
  #
  # Every other dp2 scenario splits one epoch's data across replicas (standard
  # DDP semantics), so at 10 epochs each replica takes only 20 steps against
  # dp1's 40. On the samples-consumed axis dp2 is then handicapped BY
  # CONSTRUCTION: averaging combines displacements by taking their mean, so R
  # replicas x X steps advances about X steps, not R*X. A flawless
  # implementation would still trail dp1 there.
  #
  # Here epochs are doubled so each replica takes 40 steps, matching dp1's
  # sequential depth while consuming 80 samples. That is the throughput claim:
  # "in the same number of sequential steps we processed twice the data."
  #
  # Read this one against dp1 by FINAL LOSS (see diagnostic_summary.png), not
  # on the samples axis — the evaluator's equal-samples comparison truncates to
  # the overlapping range and would silently compare only the first 40 samples.
  - name: "dp2_matched_steps"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 3
    epochs: 20          # 20 x 4 = 80 samples -> 40 steps per replica at R=2
    target_loss: 2.0
    workers: [0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9]
    replicas: 2
    average_every: 2
    compose: "docker-compose.mesh.yml"

  # ══════════════════════════════════════════════════════════════════════
  # GATE 1 (Phase 1): real corpus + held-out eval.
  #
  # These two exist to re-validate the pipeline path on data that can
  # actually support a generalization claim, BEFORE any averaging change
  # is measured. Run them and read the eval curves:
  #
  #   sm_alpaca  — train loss falls, eval loss falls then FLATTENS. If eval
  #                loss never moves, the corpus/masking/LR is wrong and
  #                nothing downstream means anything.
  #   dp1_alpaca — must match sm_alpaca within seed noise. dp1 is a pure
  #                pipeline split with no averaging, so any gap here is a
  #                pipeline bug and would otherwise be misattributed to
  #                averaging in every dp2 comparison that follows.
  #
  # 1 epoch = 1,000 samples. Do NOT raise this to 10: alpaca is not a
  # memorization fixture and 10 epochs would just measure overfitting.
  # ══════════════════════════════════════════════════════════════════════

  - name: "sm_alpaca"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 3
    epochs: 1
    target_loss: 2.0
    dataset: "alpaca1k"
    eval_every: 100
    eval_samples: 64
    batch_size: 1
    workers: []          # In-process reference

  - name: "dp1_alpaca"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 3
    epochs: 1
    target_loss: 2.0
    dataset: "alpaca1k"
    eval_every: 100
    eval_samples: 64
    batch_size: 1
    workers: [0.9, 0.9, 0.9]
    replicas: 1
    compose: "docker-compose.internet.yml"

  # ══════════════════════════════════════════════════════════════════════
  # PHASE 5 — the A/B this whole plan exists to settle.
  #
  # Established by the diagnostic run, not up for re-litigation here:
  # the round/queue/barrier plumbing is sound (dp1_mesh ~= dp1), the uniform
  # merge does not damage weights (dp2_mirror ~= dp1), and LoRA bilinearity
  # is not the dominant cause at this scale (dp2_freeze_a still bad). What
  # DID move the needle was merge FREQUENCY: only X=20 — one merge for the
  # whole run — recovered. Both mechanisms below attack that directly:
  #
  #   sparse — merge every step, but perturb only ~p of the coordinates, so
  #            local Adam moments stay approximately valid.
  #   DiLoCo — merge rarely (X=8) and route the jump through an outer
  #            Nesterov optimizer instead of overwriting weights.
  #
  # Read them on EVAL loss at equal samples consumed. All share R=2, 7
  # workers (2 pipes + 1 spare), 3 seeds, 1 epoch of alpaca1k.
  # ══════════════════════════════════════════════════════════════════════

  # The A/B baseline: current uniform averaging on real data.
  - name: "dp2_alpaca"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 3
    epochs: 1
    target_loss: 2.0
    dataset: "alpaca1k"
    eval_every: 100
    eval_samples: 64
    workers: [0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9]
    replicas: 2
    average_every: 2
    compose: "docker-compose.mesh.yml"

  # Sparse averaging at the design default. average_every: 1 is deliberate —
  # the claim is that sparse merges are cheap enough to do EVERY step, which
  # is also what makes this the stepping stone to the async design.
  - name: "dp2_sparse5"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 3
    epochs: 1
    target_loss: 2.0
    dataset: "alpaca1k"
    eval_every: 100
    eval_samples: 64
    workers: [0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9]
    replicas: 2
    average_every: 1
    sparse_p: 0.05
    full_sync_every: 10
    compose: "docker-compose.mesh.yml"

  # Sensitivity point. If p=0.20 is no better than p=0.05, sparsity is doing
  # its work through "small perturbation" as claimed; if it is much better,
  # the mechanism is really just "more averaging" and the story changes.
  - name: "dp2_sparse20"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 3
    epochs: 1
    target_loss: 2.0
    dataset: "alpaca1k"
    eval_every: 100
    eval_samples: 64
    workers: [0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9]
    replicas: 2
    average_every: 1
    sparse_p: 0.20
    full_sync_every: 10
    compose: "docker-compose.mesh.yml"

  # DiLoCo arm: dense merges, but RARE (X=8) and applied through an outer
  # Nesterov step (lr 0.7, momentum 0.9). Rare merges are the point — do not
  # "fix" this by lowering average_every.
  - name: "dp2_diloco"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 3
    epochs: 1
    target_loss: 2.0
    dataset: "alpaca1k"
    eval_every: 100
    eval_samples: 64
    workers: [0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9]
    replicas: 2
    average_every: 8
    outer_opt: true
    compose: "docker-compose.mesh.yml"

  # Optional combination: sparse rounds every step, with the outer step
  # taken at each full sync (the only rounds where a complete pseudo-gradient
  # exists). Run it only if the two mechanisms separately both help — if
  # either is neutral, this arm cannot be interpreted.
  - name: "dp2_sparse_diloco"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 3
    epochs: 1
    target_loss: 2.0
    dataset: "alpaca1k"
    eval_every: 100
    eval_samples: 64
    workers: [0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9]
    replicas: 2
    average_every: 1
    sparse_p: 0.05
    full_sync_every: 10
    outer_opt: true
    compose: "docker-compose.mesh.yml"

  # Recovery on real data. EDIT sparse_p / outer_opt to match whichever arm
  # won above before running this — it is meant to show that the winning
  # mechanism survives a mid-run worker loss, not to test a stale default.
  # A same-stage spare exists, so the spare is promoted with ~0 transfer and
  # R holds at 2; degraded_sample_fraction should stay 0.0.
  - name: "dp2_alpaca_kill"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 3
    epochs: 1
    target_loss: 2.0
    dataset: "alpaca1k"
    eval_every: 100
    eval_samples: 64
    workers: [0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9]
    replicas: 2
    average_every: 1
    sparse_p: 0.05
    full_sync_every: 10
    kill_after_epochs: 1
    compose: "docker-compose.mesh.yml"

  # LR sanity seed for the R=2 arms (working note in the plan): weight
  # averaging makes the effective update the MEAN of R local updates, so at
  # fixed LR an R=2 mesh travels ~half the distance per sample. Record one
  # lr_scale: 2.0 arm so a gap that is really a missing hyperparameter is
  # not reported as an averaging defect.
  - name: "dp2_alpaca_lr2x"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 3
    epochs: 1
    target_loss: 2.0
    dataset: "alpaca1k"
    eval_every: 100
    eval_samples: 64
    workers: [0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9]
    replicas: 2
    average_every: 2
    lr_scale: 2.0
    compose: "docker-compose.mesh.yml"
