scenarios:
  - name: "single_machine"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 5
    epochs: 10
    target_loss: 2.0
    workers: [] # In-process

  - name: "single_machine_offload"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 5
    epochs: 10
    target_loss: 2.0
    workers: [] # In-process

  # - name: "single_machine_qlora"
  #   model: "Qwen/Qwen2.5-0.5B-Instruct"
  #   num_seeds: 5
  #   epochs: 10
  #   target_loss: 2.0
  #   workers: [] # In-process

  # The control (§6.2): the existing 3-stage pipeline, renamed. Non-negotiable —
  # without it "averaging works" cannot be separated from "we changed the compute".
  - name: "dp1"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 5
    epochs: 10
    target_loss: 2.0
    workers: [0.9, 0.9, 0.9] # 3 workers via gateway
    replicas: 1
    compose: "docker-compose.internet.yml"

  # Headline (§6.2): does the mesh run and learn without regression?
  # X=2 (not 10) so rounds actually fire ~10 times per run at N=4 (§6.3).
  # 6 workers = 2 pipes x 3 stages, NO spare — sized to fit a ~4 GB card.
  # On an 8 GB+ card switch both dp2 scenarios to docker-compose.mesh.yml
  # (7 workers, adds a spare) and bump `workers` to seven entries; that also
  # upgrades dp2_kill from R-degradation to zero-transfer spare promotion.
  - name: "dp2"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    num_seeds: 5
    epochs: 10
    target_loss: 2.0
    workers: [0.9, 0.9, 0.9, 0.9, 0.9, 0.9] # 6 workers: 2 pipes, no spare
    replicas: 2
    average_every: 2
    compose: "docker-compose.mesh-nospare.yml"

  # Fault injection mid-run (§6.2). Fully valid at N=4 — recovery needs no
  # data diversity. With no spare this exercises §3.10 stage E's "if there had
  # been no spare" path: R drops 2 -> 1, the orphaned stage peers rejoin their
  # layer-peer groups and stay promotable, throughput halves, correctness
  # holds. `degraded_sample_fraction` in the metrics records how much of the
  # run trained below nominal R.
  # - name: "dp2_kill"
  #   model: "Qwen/Qwen2.5-0.5B-Instruct"
  #   num_seeds: 5
  #   epochs: 10
  #   target_loss: 2.0
  #   workers: [0.9, 0.9, 0.9, 0.9, 0.9, 0.9]
  #   replicas: 2
  #   average_every: 2
  #   compose: "docker-compose.mesh.yml"
  #   kill_after_epochs: 5
