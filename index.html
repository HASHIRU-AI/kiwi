<!doctype html>
<html lang="en" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kiwi — Enterprise Compute Swarm</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-full bg-slate-950 text-slate-100">
  <main class="mx-auto flex min-h-screen max-w-5xl flex-col px-5 py-8">
    <header class="mb-7 flex items-center gap-3">
      <div class="grid h-11 w-11 place-items-center rounded-xl bg-lime-400 text-2xl text-slate-950">K</div>
      <div>
        <h1 class="text-xl font-semibold tracking-tight">Kiwi Compute Swarm</h1>
        <p class="text-sm text-slate-400">Fault-tolerant P2P tensor forwarding</p>
      </div>
      <a href="/registry" target="_blank" class="ml-auto text-sm text-lime-300 hover:text-lime-200">View live registry</a>
      <button id="toggleTopo" class="rounded-lg border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs text-slate-300 transition hover:border-lime-400 hover:text-lime-300">Topology</button>
    </header>

    <section id="topoPanel" class="mb-5 hidden rounded-2xl border border-slate-800 bg-slate-900/50 p-3 shadow-2xl shadow-black/20">
      <canvas id="topoCanvas" width="960" height="220" class="mx-auto block"></canvas>
    </section>

    <section id="chat" class="flex-1 space-y-5 rounded-2xl border border-slate-800 bg-slate-900/50 p-5 shadow-2xl shadow-black/20" aria-live="polite">
      <div class="rounded-xl bg-slate-800/70 p-4 text-slate-300">
        Ask the distributed compute swarm anything. Stop an active worker mid-stream to watch cache rebuild and rerouting.
      </div>
    </section>

    <form id="composer" class="mt-5 flex flex-col gap-3 sm:flex-row">
      <div class="flex flex-1 gap-3">
        <textarea id="prompt" rows="2" required placeholder="Write a 300-word essay about the history of distributed systems."
          class="min-h-14 flex-1 resize-none rounded-xl border border-slate-700 bg-slate-900 px-4 py-3 text-slate-100 outline-none placeholder:text-slate-500 focus:border-lime-400"></textarea>
      </div>
      <div class="flex items-center gap-3">
        <div class="relative flex-1 sm:w-48">
          <label class="sr-only" for="modelSelect">Select Model</label>
          <select id="modelSelect" class="w-full h-full min-h-14 rounded-xl border border-slate-700 bg-slate-900 px-4 py-3 text-slate-100 outline-none focus:border-lime-400 appearance-none cursor-pointer">
            <option value="">Loading models...</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
            <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
              <path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/>
            </svg>
          </div>
        </div>
        <button id="send" type="submit" class="h-14 rounded-xl bg-lime-400 px-6 font-semibold text-slate-950 transition hover:bg-lime-300 disabled:cursor-not-allowed disabled:opacity-50">Send</button>
      </div>
    </form>
  </main>

  <script>
    /* ── Topology Visualization ────────────────────────────────── */
    const topoPanel = document.querySelector('#topoPanel');
    const topoCanvas = document.querySelector('#topoCanvas');
    const toggleTopo = document.querySelector('#toggleTopo');
    const ctx = topoCanvas.getContext('2d');
    let topoVisible = false;
    let registryData = [];
    let particlePhase = 0;
    let isGenerating = false;
    let activeNodes = null;

    function resizeCanvas() {
      const parent = topoCanvas.parentElement;
      if (parent && !parent.classList.contains('hidden')) {
        const rect = parent.getBoundingClientRect();
        topoCanvas.width = Math.max(640, rect.width - 24);
      }
    }

    toggleTopo.addEventListener('click', () => {
      topoVisible = !topoVisible;
      topoPanel.classList.toggle('hidden', !topoVisible);
      toggleTopo.textContent = topoVisible ? 'Hide Topology' : 'Topology';
      if (topoVisible) {
        resizeCanvas();
        drawTopo();
      }
    });

    window.addEventListener('resize', () => {
      if (topoVisible) {
        resizeCanvas();
        drawTopo();
      }
    });

    function drawRoundedRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function drawTopo() {
      const W = topoCanvas.width, H = topoCanvas.height;
      ctx.clearRect(0, 0, W, H);
      if (!registryData.length) {
        ctx.fillStyle = '#64748b';
        ctx.font = '13px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('No workers registered', W / 2, H / 2);
        return;
      }

      const gwX = W / 2, gwY = 30;

      // Group workers by model
      const models = {};
      registryData.forEach(w => {
        const mid = w.model_id || 'unknown';
        if (!models[mid]) models[mid] = [];
        models[mid].push(w);
      });

      const modelIds = Object.keys(models);
      const workerY = 130;

      // Active node URLs as a set for quick lookups
      const activeSet = new Set();
      if (activeNodes) Object.values(activeNodes).forEach(u => activeSet.add(u));

      // Lay out workers in a flat row, grouped by model
      let allWorkers = [];
      modelIds.forEach(mid => {
        models[mid].forEach(w => allWorkers.push({ ...w, _modelId: mid }));
      });

      const gap = 12;
      const maxTotalWidth = W - 32;
      let nodeW = 130;
      if (allWorkers.length * nodeW + (allWorkers.length - 1) * gap > maxTotalWidth) {
        nodeW = Math.max(65, (maxTotalWidth - (allWorkers.length - 1) * gap) / allWorkers.length);
      }
      const nodeH = 82, nodeR = 8;
      const isCompact = nodeW < 120;

      // Gateway node (keep fixed width of 120 so it looks clean)
      drawRoundedRect(gwX - 120 / 2, gwY - 18, 120, 36, 8);
      ctx.fillStyle = '#1e293b';
      ctx.fill();
      ctx.strokeStyle = '#a3e635';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = '#a3e635';
      ctx.font = 'bold 13px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('Gateway', gwX, gwY + 5);

      const totalWidth = allWorkers.length * nodeW + (allWorkers.length - 1) * gap;
      const startX = W / 2 - totalWidth / 2 + nodeW / 2;

      // Calculate coordinates first
      const coords = {};
      allWorkers.forEach((w, i) => {
        const pt = {
          x: startX + i * (nodeW + gap),
          y: workerY
        };
        coords[w.node_name] = pt; // Unique key by node_name to prevent overlap
        if (w.node_url) {
          coords[w.node_url] = pt;
        }
        if (w.peer_id) {
          coords[w.peer_id] = pt;
        }
      });

      // ── Draw Edges & Paths ──
      // Build the active pipeline path if generating
      const pathPoints = [];
      if (isGenerating && activeNodes) {
        pathPoints.push({ x: gwX, y: gwY + 18 });
        // Sort keys like stage_0, stage_1, stage_2 to get correct order
        const sortedKeys = Object.keys(activeNodes).sort((a, b) => {
          const idxA = parseInt(a.split('_')[1]) || 0;
          const idxB = parseInt(b.split('_')[1]) || 0;
          return idxA - idxB;
        });
        sortedKeys.forEach(k => {
          const urlOrPeerId = activeNodes[k];
          const pt = coords[urlOrPeerId];
          if (pt) pathPoints.push(pt);
        });
        pathPoints.push({ x: gwX, y: gwY + 18 });
      }

      // 1. Draw idle/pool edges
      allWorkers.forEach(w => {
        const pt = coords[w.node_name]; // Use node_name key
        const isActive = activeSet.has(w.node_url) || (w.peer_id && activeSet.has(w.peer_id));
        // Only draw radial gateway lines for workers that are not in the active pipeline
        if (!isGenerating || !isActive) {
          ctx.beginPath();
          ctx.moveTo(gwX, gwY + 18);
          ctx.lineTo(pt.x, pt.y - nodeH / 2);
          ctx.strokeStyle = w.healthy ? '#334155' : '#7f1d1d';
          ctx.lineWidth = 1.0;
          ctx.setLineDash(w.healthy ? [] : [4, 4]);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      });

      // 2. Draw active sequential P2P pipeline path
      if (pathPoints.length > 1) {
        ctx.beginPath();
        ctx.moveTo(pathPoints[0].x, pathPoints[0].y);
        for (let i = 1; i < pathPoints.length; i++) {
          // If connecting back to gateway or from gateway, use top boundary; else center
          const targetY = (i === 0 || i === pathPoints.length - 1) ? pathPoints[i].y : pathPoints[i].y;
          ctx.lineTo(pathPoints[i].x, targetY);
        }
        ctx.strokeStyle = '#a3e635';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // 3. Draw the flowing sequential particle
        const numSegs = pathPoints.length - 1;
        const segProgress = particlePhase / 100;
        const segFloat = segProgress * numSegs;
        const segIdx = Math.min(Math.floor(segFloat), numSegs - 1);
        const t = segFloat - segIdx;
        const startPt = pathPoints[segIdx];
        const endPt = pathPoints[segIdx + 1];

        const px = startPt.x + (endPt.x - startPt.x) * t;
        const py = startPt.y + (endPt.y - startPt.y) * t;

        ctx.beginPath();
        ctx.arc(px, py, 4.0, 0, Math.PI * 2);
        ctx.fillStyle = '#a3e635';
        ctx.shadowColor = '#a3e635';
        ctx.shadowBlur = 6;
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      // ── Draw Worker Nodes ──
      allWorkers.forEach((w, i) => {
        const pt = coords[w.node_name]; // Use node_name key
        const x = pt.x;
        const y = pt.y;
        const isActive = activeSet.has(w.node_url) || (w.peer_id && activeSet.has(w.peer_id));
        const isDimmed = isGenerating && activeNodes && !isActive;

        // Node box styling based on state
        let borderStroke = '#334155';
        let borderWidth = 1.0;
        let shadowColor = 'transparent';
        let shadowBlur = 0;
        let mainTextColor = '#94a3b8';
        let subTextColor = '#64748b';

        if (w.healthy) {
          if (isGenerating) {
            if (isActive) {
              borderStroke = '#a3e635'; // Bright lime green for active
              borderWidth = 3.0;
              shadowColor = '#a3e635';
              shadowBlur = 12;
              mainTextColor = '#ffffff';
              subTextColor = '#a3e635';
            } else {
              borderStroke = '#1e293b'; // Darker/dimmed for inactive
              borderWidth = 1.0;
              mainTextColor = '#475569';
              subTextColor = '#334155';
            }
          } else {
            // Idle and ready
            borderStroke = '#475569';
            borderWidth = 1.5;
            mainTextColor = '#e2e8f0';
            subTextColor = '#94a3b8';
          }
        } else {
          // Unhealthy/Evicted
          borderStroke = '#ef4444';
          borderWidth = 2.0;
          mainTextColor = '#fca5a5';
          subTextColor = '#f87171';
        }

        // Draw node background
        drawRoundedRect(x - nodeW / 2, y - nodeH / 2, nodeW, nodeH, nodeR);
        ctx.fillStyle = w.healthy ? '#0f172a' : '#1c0a0a';
        ctx.globalAlpha = isDimmed ? 0.35 : 1.0;
        ctx.fill();

        // Draw node border with glow if active
        if (shadowBlur > 0) {
          ctx.shadowColor = shadowColor;
          ctx.shadowBlur = shadowBlur;
          ctx.strokeStyle = borderStroke + '66'; // semi-transparent glow
          ctx.lineWidth = borderWidth + 4;
          ctx.stroke();
          ctx.shadowBlur = 0;
        }

        ctx.strokeStyle = borderStroke;
        ctx.lineWidth = borderWidth;
        ctx.stroke();

        // Text
        ctx.fillStyle = mainTextColor;
        ctx.font = isActive 
          ? (isCompact ? 'bold 11px system-ui' : 'bold 13px system-ui') 
          : (isCompact ? 'bold 10px system-ui' : 'bold 12px system-ui');
        ctx.textAlign = 'center';
        ctx.fillText(w.node_name, x, y - 20);

        ctx.fillStyle = subTextColor;
        ctx.font = isCompact ? '9px system-ui' : '10px system-ui';
        // Show model short name + layer range
        const shortModel = (w.model_id || '').split('/').pop() || '?';
        ctx.fillText(`${shortModel}`, x, y - 6);
        ctx.fillText(`L${w.layers[0]}-${w.layers[1]}`, x, y + 6);
        
        // Show hardware specs
        const cpuText = w.cpu_cores ? `${w.cpu_cores}c` : '?c';
        const vramText = w.vram_gb ? `${w.vram_gb.toFixed(0)}G` : '?G';
        ctx.fillText(isCompact ? `HW: ${cpuText}/${vramText}` : `CPU: ${w.cpu_cores} Cores | VRAM: ${vramText}`, x, y + 18);
        
        // Show latency / staleness
        const latencyText = w.latency_ms !== undefined && w.latency_ms > 0 ? `${w.latency_ms.toFixed(0)}ms` : '0ms';
        ctx.fillText(w.healthy ? (isCompact ? `${latencyText} (${w.last_seen.toFixed(0)}s)` : `Ping: ${latencyText} (${w.last_seen.toFixed(0)}s ago)`) : 'EVICTED', x, y + 30);
        ctx.globalAlpha = 1.0;
      });

      // Model labels at bottom
      ctx.fillStyle = '#475569';
      ctx.font = '10px system-ui';
      ctx.textAlign = 'left';
      modelIds.forEach((mid, i) => {
        const shortModel = mid.split('/').pop() || mid;
        const count = models[mid].length;
        ctx.fillText(`${shortModel} (${count} workers)`, 16, H - 8 - i * 14);
      });
    }

    // Poll registry and animate
    async function pollRegistry() {
      try {
        const resp = await fetch('/registry');
        const data = await resp.json();
        registryData = data.workers || [];
      } catch (e) { /* ignore */ }
    }

    pollRegistry();
    setInterval(pollRegistry, 2000);
    setInterval(() => {
      if (topoVisible) {
        particlePhase = (particlePhase + 2) % 100;
        drawTopo();
      }
    }, 50);
  </script>

  <script>
    /* ── Chat Logic ────────────────────────────────────────────── */
    const chat = document.querySelector('#chat');
    const form = document.querySelector('#composer');
    const promptInput = document.querySelector('#prompt');
    const sendButton = document.querySelector('#send');
    const modelSelect = document.querySelector('#modelSelect');
    const conversationHistory = [];

    // Store the selected model globally so it isn't lost during temporary errors
    let userSelectedModel = null;
    modelSelect.addEventListener('change', () => {
      userSelectedModel = modelSelect.value;
    });

    // Fetch and populate servable models dynamically
    async function loadModels() {
      try {
        const response = await fetch('/v1/models');
        const result = await response.json();
        const currentSelected = userSelectedModel || modelSelect.value;
        modelSelect.innerHTML = '';
        
        if (result.data && result.data.length > 0) {
          result.data.forEach(model => {
            const opt = document.createElement('option');
            opt.value = model.id;
            // Format model name for friendly reading
            const shortName = model.id.split('/').pop();
            const alias = model.aliases.length > 0 ? ` (${model.aliases[0]})` : '';
            opt.textContent = `${shortName}${alias}${model.ready ? '' : ' (Not Ready)'}`;
            modelSelect.appendChild(opt);
          });
          // Explicitly set the value after appending all options
          if (currentSelected) {
            modelSelect.value = currentSelected;
          }
          // If the select value didn't match (e.g. invalid model), update the global tracker to the new default
          if (!userSelectedModel) {
             userSelectedModel = modelSelect.value;
          }
        } else {
          modelSelect.innerHTML = '<option value="">No models registered</option>';
        }
      } catch (error) {
        // Only show error if we don't have existing models to prevent flickering
        if (modelSelect.options.length <= 1) {
          modelSelect.innerHTML = '<option value="">Error loading models</option>';
        }
      }
    }

    // Load models initially and refresh periodically
    loadModels();
    setInterval(loadModels, 5000);

    function addMessage(text, kind) {
      const message = document.createElement('div');
      message.className = kind === 'user'
        ? 'ml-auto max-w-3xl rounded-xl bg-lime-400 px-4 py-3 text-slate-950'
        : 'max-w-3xl whitespace-pre-wrap rounded-xl bg-slate-800 px-4 py-3 text-slate-100';
      message.textContent = text;
      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;
      return message;
    }

    function appendDelta(container, text) {
      if (text === '[REROUTING...]') {
        const warning = document.createElement('span');
        warning.className = 'font-bold text-red-500';
        warning.textContent = '[REROUTING...]';
        container.appendChild(warning);
        container.appendChild(document.createTextNode(' '));
      } else {
        container.appendChild(document.createTextNode(text));
      }
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const prompt = promptInput.value.trim();
      const selectedModel = modelSelect.value;
      if (!prompt) return;

      addMessage(prompt, 'user');
      conversationHistory.push({role: 'user', content: prompt});
      const answer = addMessage('', 'assistant');
      promptInput.value = '';
      sendButton.disabled = true;
      let assistantText = '';
      isGenerating = true;

      try {
        const response = await fetch('/v1/chat/completions', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            model: selectedModel || undefined,
            messages: [...conversationHistory],
            stream: true,
            max_tokens: 300,
          }),
        });
        if (!response.ok || !response.body) throw new Error(`Gateway returned ${response.status}`);
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        while (true) {
          const {value, done} = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, {stream: true});
          const events = buffer.split('\n\n');
          buffer = events.pop();
          for (const eventText of events) {
            const line = eventText.split('\n').find(line => line.startsWith('data: '));
            if (!line) continue;
            const data = line.slice(6);
            if (data === '[DONE]') continue;
            const event = JSON.parse(data);
            if (event.error) throw new Error(event.error.message);
            if (event.active_nodes) activeNodes = event.active_nodes;
            const delta = event.choices?.[0]?.delta?.content;
            if (delta) {
              appendDelta(answer, delta);
              if (delta !== '[REROUTING...]') assistantText += delta;
            }
          }
        }
        if (assistantText) conversationHistory.push({role: 'assistant', content: assistantText});
      } catch (error) {
        const errorText = document.createElement('span');
        errorText.className = 'font-bold text-red-500';
        errorText.textContent = `Error: ${error.message}`;
        answer.appendChild(errorText);
      } finally {
        activeNodes = null;
        isGenerating = false;
        sendButton.disabled = false;
        promptInput.focus();
      }
    });
  </script>
</body>
</html>
