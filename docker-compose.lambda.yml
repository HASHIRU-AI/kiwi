services:
  gateway:
    build:
      context: .
      target: gateway
    image: kiwi-gateway:latest
    container_name: kiwi_gateway_p2p
    command: uvicorn gateway:app --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
      - "4001:4001"
    environment:
      # Serve both Llama 3B and Qwen 0.5B
      KIWI_MODELS: |
        [
          {"model_id": "unsloth/Llama-3.2-3B-Instruct", "aliases": ["llama-3b", "kiwi-medium"], "default_dtype": "bfloat16"},
          {"model_id": "Qwen/Qwen2.5-0.5B-Instruct", "aliases": ["qwen-0.5b", "kiwi-small"], "default_dtype": "bfloat16"}
        ]
      REQUEST_TIMEOUT_SECONDS: "300"
      KIWI_P2P_TRANSPORT: "p2p"
      KIWI_P2P_PORT: "4001"
      # If left blank or unset, the gateway automatically discovers its public IP via ipify.org
      KIWI_P2P_PUBLIC_HOST: "${LAMBDA_IP:-}"

    volumes:
      - hf_cache:/root/.cache/huggingface
      - ./gateway.py:/app/gateway.py
      - ./models.py:/app/models.py
      - ./transport.py:/app/transport.py
      - ./index.html:/app/index.html
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8080/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker-1:
    build:
      context: .
      target: worker
    image: kiwi-worker:latest
    container_name: harshil_worker_1_p2p
    init: true
    command: uvicorn worker:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
      - "4002:4002"
    environment:
      NODE_NAME: lambda_worker_1
      NODE_URL: http://worker-1:8000
      GATEWAY_URL: http://gateway:8080
      KIWI_P2P_TRANSPORT: "p2p"
      KIWI_P2P_PORT: "4002"
      KIWI_RELAY_PEERS: ""
      KIWI_USE_CSR: "false"
      KIWI_USE_INT8: "true"
      KIWI_LOSSLESS: "zstd"
      GPU_MEMORY_RESERVE_MB: "512"
      KIWI_VRAM_GB_OVERRIDE: "4.0"

    volumes:
      - hf_cache:/root/.cache/huggingface
      - ./worker.py:/app/worker.py
      - ./models.py:/app/models.py
      - ./transport.py:/app/transport.py
    depends_on:
      gateway:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  worker-2:
    image: kiwi-worker:latest
    container_name: harshil_worker_2_p2p
    init: true
    command: uvicorn worker:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
      - "4003:4003"
    environment:
      NODE_NAME: lambda_worker_2
      NODE_URL: http://worker-2:8000
      GATEWAY_URL: http://gateway:8080
      KIWI_P2P_TRANSPORT: "p2p"
      KIWI_P2P_PORT: "4003"
      KIWI_RELAY_PEERS: ""
      KIWI_USE_CSR: "false"
      KIWI_USE_INT8: "true"
      KIWI_LOSSLESS: "zstd"
      GPU_MEMORY_RESERVE_MB: "512"
      KIWI_VRAM_GB_OVERRIDE: "4.0"

    volumes:
      - hf_cache:/root/.cache/huggingface
      - ./worker.py:/app/worker.py
      - ./models.py:/app/models.py
      - ./transport.py:/app/transport.py
    depends_on:
      gateway:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

volumes:
  hf_cache:
