services:
  gateway:
    build:
      context: .
      target: gateway
    image: kiwi-gateway:latest
    container_name: kiwi_gateway_1
    command: uvicorn gateway:app --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    environment:
      # Serve one model (Qwen 0.5B)
      KIWI_MODELS: |
        [
          {"model_id": "Qwen/Qwen2.5-0.5B-Instruct", "aliases": ["qwen-0.5b", "kiwi-small"], "default_dtype": "bfloat16"}
        ]
      REQUEST_TIMEOUT_SECONDS: "120"
    volumes:
      - hf_cache:/root/.cache/huggingface
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker_1:
    build:
      context: .
      target: worker
    image: kiwi-worker:latest
    container_name: kiwi-worker_1-1
    init: true
    command: uvicorn worker:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      NODE_NAME: worker_1
      NODE_URL: http://worker_1:8000
      GATEWAY_URL: http://gateway:8080
      KIWI_USE_CSR: "false"
      KIWI_USE_INT8: "true"
      KIWI_CSR_SPARSITY: "0.40"
      KIWI_LOSSLESS: "zstd"
      GPU_MEMORY_RESERVE_MB: "512"
      KIWI_VRAM_GB_OVERRIDE: "1.0" # Very low VRAM, will split model layers (e.g. 0-6)
    volumes:
      - hf_cache:/root/.cache/huggingface
    depends_on:
      gateway:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  worker_2:
    image: kiwi-worker:latest
    container_name: kiwi-worker_2-1
    init: true
    command: uvicorn worker:app --host 0.0.0.0 --port 8000
    environment:
      NODE_NAME: worker_2
      NODE_URL: http://worker_2:8000
