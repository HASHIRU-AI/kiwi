      KIWI_USE_CSR: "false"
      KIWI_USE_INT8: "true"
      KIWI_CSR_SPARSITY: "0.40"
      KIWI_LOSSLESS: "zstd"
      GPU_MEMORY_RESERVE_MB: "512"
      KIWI_VRAM_GB_OVERRIDE: "1.0" # Very low VRAM, will split model layers (e.g. 7-13)
    volumes:
      - hf_cache:/root/.cache/huggingface
    depends_on:
      gateway:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  worker_3:
