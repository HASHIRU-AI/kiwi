# Async-mesh testbed: 6 workers -> 3 stages, R=2 pipes, NO spare.
#
# The same mesh as docker-compose.mesh.yml minus the spare, sized to fit a
# ~4 GB card (~5.7 GB vs ~6.6 GB — still tight, but far less spill).
#
# The trade-off is which failure path you exercise. With no spare, a worker
# death drops R from 2 to 1 (§3.10 stage E, "if there had been no spare"):
# the orphaned stage peers rejoin their layer-peer groups and stay
# promotable, replica 1 starts returning 409 so its consumer retires, and
# throughput halves. Correctness and convergence are untouched — only the
# zero-transfer-promotion claim needs the 7-worker file.
services:
  gateway:
    build:
      context: .
      target: gateway
    image: kiwi-gateway:latest
    container_name: kiwi_gateway_mesh
    command: uvicorn gateway:app --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
      - "4001:4001"
    environment:
      KIWI_MODELS: |
        [
          {"model_id": "Qwen/Qwen2.5-0.5B-Instruct", "aliases": ["qwen-0.5b", "kiwi-small"], "default_dtype": "bfloat16"}
        ]
      REQUEST_TIMEOUT_SECONDS: "300"
      # A worker time-sharing an oversubscribed GPU can be slow enough to delay
      # its heartbeat well past the default 30s. Evicting it collapses R
      # mid-run and silently degrades the benchmark, so widen the window.
      HEARTBEAT_SOFT_STALE_SECONDS: "180"
      HEARTBEAT_HARD_STALE_SECONDS: "600"
      KIWI_P2P_TRANSPORT: "p2p"
      KIWI_P2P_PORT: "4001"
      KIWI_P2P_PUBLIC_HOST: "http://gateway:4001"
    volumes:
      - hf_cache:/root/.cache/huggingface
      - ./gateway.py:/app/gateway.py
      - ./models.py:/app/models.py
      - ./transport.py:/app/transport.py
      - ./index.html:/app/index.html
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker_1:
    build:
      context: .
      target: worker
    image: kiwi-worker:latest
    container_name: kiwi-worker_1_mesh
    init: true
    command: uvicorn worker:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
      - "4002:4002"
    environment:
      NODE_NAME: worker_1
      NODE_URL: http://worker_1:8000
      GATEWAY_URL: http://gateway:8080
      KIWI_P2P_TRANSPORT: "p2p"
      KIWI_P2P_PORT: "4002"
      KIWI_RELAY_PEERS: ""
      GPU_MEMORY_RESERVE_MB: "512"
      KIWI_VRAM_GB_OVERRIDE: "0.9"
      KIWI_LR: ${KIWI_LR:-2e-4}
      KIWI_FREEZE_LORA_A: ${KIWI_FREEZE_LORA_A:-0}
      # Trades ~30% step time for ~25x less activation memory. Required at
      # alpaca1k sequence lengths under the 0.9 GB cap; set to 0 only to
      # reproduce a pre-checkpointing timing baseline.
      KIWI_GRAD_CHECKPOINT: ${KIWI_GRAD_CHECKPOINT:-1}
      KIWI_T_ROUND: "120"
    volumes:
      - hf_cache:/root/.cache/huggingface
      - ./worker.py:/app/worker.py
      - ./mesh.py:/app/mesh.py
      - ./models.py:/app/models.py
      - ./transport.py:/app/transport.py
    depends_on:
      gateway:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [ gpu ]

